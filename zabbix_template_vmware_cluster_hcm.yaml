        type: DEPENDENT
        key: 'vmc.cluster.vsan.pused[{#CLUSTER}]'
        delay: '0'
        history: 30d
        value_type: FLOAT
        units: '%'
        master_item:
          key: vmc.metrics
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |-
            var get = function (n) {
              var c = '{#CLUSTER}'.replace(/[^A-Za-z0-9_-]/g, '\\$&');
              var r = new RegExp('^' + n + '\\{cluster="' + c + '"\\} (\\S+)', 'm').exec(value);
              if (!r) throw 'missing ' + n;
