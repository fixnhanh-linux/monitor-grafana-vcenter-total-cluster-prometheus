zabbix_export:
  version: '6.0'
  date: '2026-10-17T00:00:00Z'
  groups:
  - uuid: d1ea2541d477442392b39f0c9944890f
    name: Templates/VMware
  templates:
  - uuid: 796759aa193848d88344eeff7f8358fe
    template: VMware Cluster HCM By VMware Cluster Exporter
    name: VMware Cluster HCM By VMware Cluster Exporter
    description: |-
      Per-cluster VMware totals from vmware-cluster-exporter (vmware_cluster_* metrics).
      One host per exporter instance: set macro {$VMC.PORT} (9821 pool18, 9822 pool25, 9823 pool6, 9824 core) and an interface with IP 10.0.0.10.
      Thresholds are macros matching the Grafana dashboard VMWARE CLUSTER HCM colors.
    groups:
    - name: Templates/VMware
    items:
    - uuid: 977be66544c544ab82d49f3275df920f
      name: 'Exporter: /metrics'
      type: HTTP_AGENT
      key: vmc.metrics
      delay: 1m
      history: '0'
      trends: '0'
      value_type: TEXT
      timeout: 15s
      url: 'http://{HOST.CONN}:{$VMC.PORT}/metrics'
      description: 'Master item: all metrics from vmware-cluster-exporter (no history kept)'
      tags:
      - tag: component
        value: raw
    - uuid: 714599446e984168af2a68c9b098346f
      name: 'Exporter: vCenter Collection'
      type: DEPENDENT
      key: vmc.exporter.up
      delay: '0'
      history: 7d
      value_type: UNSIGNED
      master_item:
        key: vmc.metrics
      valuemap:
        name: Exporter up
      preprocessing:
      - type: PROMETHEUS_PATTERN
        parameters:
        - vmware_cluster_exporter_up
        - value
        - ''
      tags:
      - tag: component
        value: exporter
      triggers:
      - uuid: cd14aa1262314927b9f61daa65fb540a
        expression: last(/VMware Cluster HCM By VMware Cluster Exporter/vmc.exporter.up)=0
        name: 'Exporter: Cannot Collect Data From vCenter'
        priority: HIGH
        description: 'Check the log: journalctl -u vmware-cluster-exporter@<instance> -n 50'
        dependencies:
        - name: 'Exporter: No Data From /metrics For {$VMC.NODATA}'
          expression: 'nodata(/VMware Cluster HCM By VMware Cluster Exporter/vmc.exporter.up,{$VMC.NODATA})=1'
      - uuid: 2643626c4abb401d990f953cfe8c196b
        expression: 'nodata(/VMware Cluster HCM By VMware Cluster Exporter/vmc.exporter.up,{$VMC.NODATA})=1'
        name: 'Exporter: No Data From /metrics For {$VMC.NODATA}'
        priority: HIGH
        description: 'Check the vmware-cluster-exporter service and firewall port {$VMC.PORT}'
    - uuid: 325ce3de586445e588f79c4e6a436c41
      name: 'Exporter: Last Successful Collection'
      type: DEPENDENT
      key: vmc.exporter.last_success
      delay: '0'
      history: 7d
      value_type: UNSIGNED
      units: unixtime
      master_item:
        key: vmc.metrics
      preprocessing:
      - type: PROMETHEUS_PATTERN
        parameters:
        - vmware_cluster_exporter_last_success_timestamp_seconds
        - value
        - ''
      tags:
      - tag: component
        value: exporter
      triggers:
      - uuid: 6dc1d81cbbb1470781f595ccab2ce545
        expression: 'fuzzytime(/VMware Cluster HCM By VMware Cluster Exporter/vmc.exporter.last_success,10m)=0'
        name: 'Exporter: Data Older Than 10 Minutes'
        priority: WARNING
        dependencies:
        - name: 'Exporter: No Data From /metrics For {$VMC.NODATA}'
          expression: 'nodata(/VMware Cluster HCM By VMware Cluster Exporter/vmc.exporter.up,{$VMC.NODATA})=1'
    - uuid: 3cdae75694924bcbb638f96725a56bb3
      name: 'Exporter: Collection Duration'
      type: DEPENDENT
      key: vmc.exporter.duration
      delay: '0'
      history: 7d
      value_type: FLOAT
      units: s
      master_item:
        key: vmc.metrics
      preprocessing:
      - type: PROMETHEUS_PATTERN
        parameters:
        - vmware_cluster_exporter_collect_duration_seconds
        - value
        - ''
      tags:
      - tag: component
        value: exporter
    - uuid: 347ad14198ac4b1ab04042bede4ec93b
      name: 'Exporter: Version'
      type: DEPENDENT
      key: vmc.exporter.version
      delay: '0'
      history: 7d
      trends: '0'
      value_type: CHAR
      master_item:
        key: vmc.metrics
      preprocessing:
      - type: PROMETHEUS_PATTERN
        parameters:
        - vmware_cluster_exporter_build_info
        - label
        - version
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: component
        value: exporter
    discovery_rules:
    - uuid: af7200965b4d4e6281fbecddc07b3a9c
      name: Cluster Discovery
      type: DEPENDENT
      key: vmc.cluster.discovery
      delay: '0'
      master_item:
        key: vmc.metrics
      lifetime: 7d
      preprocessing:
      - type: PROMETHEUS_TO_JSON
        parameters:
        - vmware_cluster_hosts
      lld_macro_paths:
      - lld_macro: '{#CLUSTER}'
        path: $.labels.cluster
      item_prototypes:
      - uuid: f579aead8fff41fb939285b1073d89e3
        name: 'Cluster {#CLUSTER}: vCenter Status'
        type: DEPENDENT
        key: 'vmc.cluster.status[{#CLUSTER}]'
        delay: '0'
        history: 30d
        value_type: UNSIGNED
        preprocessing:
        - type: PROMETHEUS_PATTERN
          parameters:
          - 'vmware_cluster_status{cluster="{#CLUSTER}"}'
          - value
          - ''
          error_handler: DISCARD_VALUE
        master_item:
          key: vmc.metrics
        tags:
        - tag: component
          value: cluster
        - tag: cluster
          value: '{#CLUSTER}'
        description: Cluster overallStatus reported by vCenter
        valuemap:
          name: VMware color status
        trigger_prototypes:
        - uuid: c6a72186c23b48ff95fb8dd4a93f43a3
          expression: 'last(/VMware Cluster HCM By VMware Cluster Exporter/vmc.cluster.status[{#CLUSTER}])=2'
          name: 'Cluster {#CLUSTER}: vCenter Reports Status Red'
          priority: AVERAGE
      - uuid: a92072db8a844d42b96b63e52852dfd9
        name: 'Cluster {#CLUSTER}: vSAN Overall Health'
        type: DEPENDENT
        key: 'vmc.cluster.vsan.health[{#CLUSTER}]'
        delay: '0'
        history: 30d
        value_type: UNSIGNED
        preprocessing:
        - type: PROMETHEUS_PATTERN
          parameters:
          - 'vmware_cluster_vsan_health{cluster="{#CLUSTER}"}'
          - value
          - ''
          error_handler: DISCARD_VALUE
        master_item:
          key: vmc.metrics
        tags:
        - tag: component
          value: cluster
        - tag: cluster
          value: '{#CLUSTER}'
        description: vSAN Skyline Health overallHealth - red as soon as one check is red
        valuemap:
          name: vSAN health
        trigger_prototypes:
        - uuid: 7c04756e30ea4a7a9648891cc1710483
          expression: 'last(/VMware Cluster HCM By VMware Cluster Exporter/vmc.cluster.vsan.health[{#CLUSTER}])=2'
          name: 'Cluster {#CLUSTER}: vSAN Skyline Health Has A Red Check'
          priority: INFO
          description: vSAN overall health is red (at least one Unhealthy finding). Main alerting uses the health score.
      - uuid: 7b55b3b0dbd2444484b72c8f0910c43e
        name: 'Cluster {#CLUSTER}: vSAN Health Score'
        type: DEPENDENT
        key: 'vmc.cluster.vsan.score[{#CLUSTER}]'
        delay: '0'
        history: 30d
        value_type: UNSIGNED
        preprocessing:
        - type: PROMETHEUS_PATTERN
          parameters:
          - 'vmware_cluster_vsan_health_score{cluster="{#CLUSTER}"}'
          - value
          - ''
          error_handler: DISCARD_VALUE
        master_item:
          key: vmc.metrics
        tags:
        - tag: component
          value: cluster
        - tag: cluster
          value: '{#CLUSTER}'
        description: 'Cluster health score (0-100) shown in vCenter > Monitor > vSAN > Skyline Health'
        trigger_prototypes:
        - uuid: 1c5cd241014d4a7183b864b9e5aa39dd
          expression: 'last(/VMware Cluster HCM By VMware Cluster Exporter/vmc.cluster.vsan.score[{#CLUSTER}])<{$VMC.SCORE.CRIT:"{#CLUSTER}"}'
          name: 'Cluster {#CLUSTER}: vSAN Health Score < {$VMC.SCORE.CRIT}'
          priority: HIGH
