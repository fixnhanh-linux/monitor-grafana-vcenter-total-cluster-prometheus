      - uuid: a2e4388c4b9343f084d5b6db524dae52
        name: 'Cluster {#CLUSTER}: CPU Usage (%)'
        type: DEPENDENT
        key: 'vmc.cluster.cpu.pused[{#CLUSTER}]'
        delay: '0'
        history: 30d
        value_type: FLOAT
        units: '%'
        master_item:
          key: vmc.metrics
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |-
            var get = function (n) {
              var c = '{#CLUSTER}'.replace(/[^A-Za-z0-9_-]/g, '\\$&');
              var r = new RegExp('^' + n + '\\{cluster="' + c + '"\\} (\\S+)', 'm').exec(value);
              if (!r) throw 'missing ' + n;
              return parseFloat(r[1]);
            };
            var t = get('vmware_cluster_cpu_total_hz');
            if (!t) throw 'total = 0';
            return get('vmware_cluster_cpu_used_hz') / t * 100;
        tags:
        - tag: component
          value: cluster
        - tag: cluster
          value: '{#CLUSTER}'
        trigger_prototypes:
        - uuid: 060a3bcff02347de8633ead092ef61e4
