        name: 'Cluster {#CLUSTER}: Memory Usage (%)'
        type: DEPENDENT
        key: 'vmc.cluster.mem.pused[{#CLUSTER}]'
        delay: '0'
        history: 30d
        value_type: FLOAT
        units: '%'
        master_item:
          key: vmc.metrics
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |-
            var get = function (n) {
              var c = '{#CLUSTER}'.replace(/[^A-Za-z0-9_-]/g, '\\$&');
              var r = new RegExp('^' + n + '\\{cluster="' + c + '"\\} (\\S+)', 'm').exec(value);
              if (!r) throw 'missing ' + n;
              return parseFloat(r[1]);
            };
            var t = get('vmware_cluster_mem_total_bytes');
            if (!t) throw 'total = 0';
            return get('vmware_cluster_mem_used_bytes') / t * 100;
        tags:
        - tag: component
          value: cluster
        - tag: cluster
          value: '{#CLUSTER}'
