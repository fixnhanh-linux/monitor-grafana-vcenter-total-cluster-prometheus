          priority: HIGH
        - uuid: cdf783f0d4e240b684e1b3b3b8de9cb1
          expression: 'last(/VMware Cluster HCM By VMware Cluster Exporter/vmc.cluster.vsan.pused[{#CLUSTER}])>={$VMC.VSAN.WARN:"{#CLUSTER}"}'
